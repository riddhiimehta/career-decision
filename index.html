<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Offer & Relocation Decision Matrix</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --positive: #10b981;
    --negative: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 900px;
    width: 100%;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 1.75rem;
    margin-bottom: 8px;
    color: #fff;
  }

  p.subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  .section-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .factor-item {
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .factor-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .factor-label strong {
    display: block;
    color: #fff;
    font-size: 1rem;
    margin-bottom: 2px;
  }

  .factor-label span {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.3;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-top: 10px;
    align-items: center;
  }

  .control-group label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 600;
  }

  select, input[type="range"], input[type="text"] {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 6px;
    font-size: 0.9rem;
    outline: none;
    box-sizing: border-box;
  }

  select:focus, input:focus {
    border-color: var(--accent);
  }

  .range-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .range-val {
    font-weight: bold;
    min-width: 24px;
    text-align: center;
    font-size: 0.9rem;
  }

  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s;
    margin-bottom: 12px;
  }

  .btn:hover {
    background: var(--accent-hover);
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 10px;
    font-size: 0.9rem;
  }
  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .results-card {
    position: relative;
    z-index: 1;
    background: var(--card-bg);
    border: 2px solid var(--accent);
    display: none;
  }

  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }

  .result-box {
    background: var(--bg);
    padding: 16px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid var(--border);
  }

  .result-box h3 {
    margin: 0 0 6px 0;
    font-size: 0.95rem;
    color: var(--text-muted);
  }

  .result-score {
    font-size: 2.2rem;
    font-weight: bold;
  }

  .winner-banner {
    margin-top: 16px;
    padding: 16px;
    border-radius: 8px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: bold;
    border: 1px solid transparent;
  }

  .winner-banner.new {
    background: rgba(16, 185, 129, 0.15);
    color: var(--positive);
    border-color: var(--positive);
  }

  .winner-banner.current {
    background: rgba(99, 102, 241, 0.15);
    color: var(--accent);
    border-color: var(--accent);
  }

  .category-breakdown {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .cat-pill {
    background: var(--bg);
    padding: 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    text-align: center;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: var(--negative);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 2px 6px;
  }

  @media (max-width: 768px) {
    .controls-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .results-grid, .category-breakdown {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Job Offer & Relocation Decision Matrix</h1>
    <p class="subtitle">Customize weights (1-5) and rate Current Job vs. New Offer (-5 to +5).</p>
  </header>

  <form id="matrixForm">
    <div id="categoriesContainer"></div>

    <button type="button" class="btn btn-secondary" onclick="addCustomFactorPrompt()">+ Add Custom Factor</button>
    <button type="button" class="btn" onclick="calculateResults()">Calculate Final Analysis</button>
  </form>

  <div class="card results-card" id="resultsCard">
    <div class="section-title">Comprehensive Decision Analysis</div>
    <div class="results-grid">
      <div class="result-box">
        <h3>Stay at Current Job</h3>
        <div class="result-score" id="scoreCurrent">0</div>
        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Weighted total points</div>
      </div>
      <div class="result-box">
        <h3>Accept New Offer</h3>
        <div class="result-score" id="scoreNew">0</div>
        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Weighted total points</div>
      </div>
    </div>
    
    <div id="winnerBanner" class="winner-banner"></div>
    <div class="category-breakdown" id="categoryBreakdownResults"></div>
    <button type="button" class="btn btn-secondary" style="margin-top: 16px;" onclick="window.print()">Export / Save as PDF</button>
  </div>
</div>

<script>
  let categories = [
    {
      id: 'personal',
      name: '1. Personal, Lifestyle & Relationship',
      factors: [
        { id: 'gf', name: 'Proximity to Girlfriend', desc: 'Living in the same city vs. long-distance separation.', weight: 4, current: -3, newVal: 5 },
        { id: 'wfh', name: 'Flexibility & WFH Loss', desc: '0 WFH days vs. schedule autonomy/remote working.', weight: 3, current: 3, newVal: -4 },
        { id: 'fresh', name: 'Fresh Start & Social Reset', desc: 'Opportunity to build a new personal image and exit a stale environment.', weight: 3, current: -2, newVal: 4 },
        { id: 'reloc_press', name: 'Relationship & Relocation Strain', desc: 'Adjustment pressure of moving cities and living arrangements simultaneously.', weight: 3, current: 2, newVal: -2 }
      ]
    },
    {
      id: 'financial',
      name: '2. Financial & Logistics Realities',
      factors: [
        { id: 'pay', name: 'Base Pay & Gross Raise', desc: 'Salary increases, performance bonuses, and total rewards value.', weight: 4, current: 1, newVal: 4 },
        { id: 'net_income', name: 'Net Disposable Income', desc: 'Accounting for city cost of living, rent inflation, taxes, and out-of-pocket moving costs.', weight: 4, current: 2, newVal: -1 },
        { id: 'commute', name: 'Daily Commute Burden', desc: 'Unpaid travel hours weekly resulting from zero remote work days.', weight: 3, current: 3, newVal: -3 }
      ]
    },
    {
      id: 'culture',
      name: '3. Culture, Well-being & Burnout Risk',
      factors: [
        { id: 'toxic', name: 'Escape Toxic Team Dynamics', desc: 'Relief from current politics, stress, and toxic management.', weight: 4, current: -4, newVal: 1 },
        { id: 'brutal_culture', name: 'Work Intensity & Brutal Culture', desc: 'High-pressure environment, long hours, and risk of rapid compound burnout.', weight: 5, current: 2, newVal: -4 }
      ]
    },
    {
      id: 'career',
      name: '4. Career Trajectory & Scope',
      factors: [
        { id: 'level', name: 'Title Level Shift (L3 to L2)', desc: 'Perception of stepping down a tier vs. enterprise scale positioning.', weight: 3, current: 3, newVal: -1 },
        { id: 'scope', name: 'Breadth of Skill Expansion', desc: 'Expanding technical scope, learning curve, and transferable skills.', weight: 4, current: 1, newVal: 4 },
        { id: 'brand', name: 'Resume Prestige & Exit Options', desc: 'Long-term career door-opening power of the new firm’s brand name.', weight: 3, current: 1, newVal: 3 }
      ]
    }
  ];

  function renderForm() {
    const container = document.getElementById('categoriesContainer');
    if (!container) return;
    container.innerHTML = '';

    categories.forEach(cat => {
      let cardHTML = `
        <div class="card">
          <div class="section-title">${cat.name}</div>
      `;

      cat.factors.forEach(f => {
        cardHTML += `
          <div class="factor-item" id="factor-${f.id}">
            <div class="factor-header-row">
              <div class="factor-label">
                <strong>${f.name}</strong>
                <span>${f.desc}</span>
              </div>
              ${f.isCustom ? `<button type="button" class="delete-btn" onclick="deleteFactor('${cat.id}', '${f.id}')" title="Remove Factor">&times;</button>` : ''}
            </div>
            
            <div class="controls-grid">
              <div class="control-group">
                <label>Importance Weight</label>
                <select onchange="updateVal('${cat.id}', '${f.id}', 'weight', this.value)">
                  <option value="1" ${f.weight == 1 ? 'selected' : ''}>1 - Low</option>
                  <option value="2" ${f.weight == 2 ? 'selected' : ''}>2 - Moderate</option>
                  <option value="3" ${f.weight == 3 ? 'selected' : ''}>3 - Important</option>
                  <option value="4" ${f.weight == 4 ? 'selected' : ''}>4 - Very Important</option>
                  <option value="5" ${f.weight == 5 ? 'selected' : ''}>5 - Critical</option>
                </select>
              </div>

              <div class="control-group">
                <label>Current Job (-5 to +5)</label>
                <div class="range-container">
                  <input type="range" min="-5" max="5" value="${f.current}" oninput="updateVal('${cat.id}', '${f.id}', 'current', this.value); document.getElementById('cur-val-${f.id}').innerText = this.value;">
                  <span class="range-val" id="cur-val-${f.id}">${f.current}</span>
                </div>
              </div>

              <div class="control-group">
                <label>New Offer (-5 to +5)</label>
                <div class="range-container">
                  <input type="range" min="-5" max="5" value="${f.newVal}" oninput="updateVal('${cat.id}', '${f.id}', 'newVal', this.value); document.getElementById('new-val-${f.id}').innerText = this.value;">
                  <span class="range-val" id="new-val-${f.id}">${f.newVal}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      cardHTML += `</div>`;
      container.innerHTML += cardHTML;
    });
  }

  function updateVal(catId, factorId, field, val) {
    const cat = categories.find(c => c.id === catId);
    if (!cat) return;
    const factor = cat.factors.find(f => f.id === factorId);
    if (factor) {
      factor[field] = parseFloat(val);
    }
  }

  function addCustomFactorPrompt() {
    const name = prompt("Enter custom consideration name:");
    if (!name) return;
    const desc = prompt("Enter short description:") || "";
    
    const newFactor = {
      id: 'custom_' + Date.now(),
      name: name,
      desc: desc,
      weight: 3,
      current: 0,
      newVal: 0,
      isCustom: true
    };

    categories[0].factors.push(newFactor);
    renderForm();
  }

  function deleteFactor(catId, factorId) {
    const cat = categories.find(c => c.id === catId);
    if (cat) {
      cat.factors = cat.factors.filter(f => f.id !== factorId);
      renderForm();
    }
  }

  function calculateResults() {
    let totalCurrent = 0;
    let totalNew = 0;
    let categoryBreakdownHTML = '';

    categories.forEach(cat => {
      let catCurrent = 0;
      let catNew = 0;

      cat.factors.forEach(f => {
        catCurrent += f.weight * f.current;
        catNew += f.weight * f.newVal;
      });

      totalCurrent += catCurrent;
      totalNew += catNew;

      let catDiff = catNew - catCurrent;
      let catText = catDiff > 0 ? `New Offer (+${catDiff})` : catDiff < 0 ? `Current (-${Math.abs(catDiff)})` : `Tied`;
      categoryBreakdownHTML += `
        <div class="cat-pill">
          <strong>${cat.name.replace(/^\d+\.\s*/, '')}</strong><br>
          <span style="color:var(--text-muted);">${catText}</span>
        </div>
      `;
    });

    document.getElementById('scoreCurrent').innerText = totalCurrent;
    document.getElementById('scoreNew').innerText = totalNew;

    const winnerBanner = document.getElementById('winnerBanner');
    const diff = Math.abs(totalNew - totalCurrent);

    if (totalNew > totalCurrent) {
      winnerBanner.className = "winner-banner new";
      winnerBanner.innerHTML = `RECOMMENDATION: ACCEPT NEW OFFER<br><span style="font-size:0.85rem; font-weight:normal;">New offer leads by a margin of +${diff} weighted points.</span>`;
    } else if (totalCurrent > totalNew) {
      winnerBanner.className = "winner-banner current";
      winnerBanner.innerHTML = `RECOMMENDATION: STAY AT CURRENT JOB<br><span style="font-size:0.85rem; font-weight:normal;">Staying leads by a margin of +${diff} weighted points.</span>`;
    } else {
      winnerBanner.className = "winner-banner";
      winnerBanner.style.borderColor = "var(--border)";
      winnerBanner.innerHTML = `IT'S AN EXACT TIE!<br><span style="font-size:0.85rem; font-weight:normal;">Review factor weights and adjust ratings.</span>`;
    }

    document.getElementById('categoryBreakdownResults').innerHTML = categoryBreakdownHTML;
    
    const resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';
    resultsCard.scrollIntoView({ behavior: 'smooth' });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderForm);
  } else {
    renderForm();
  }
</script>

</body>
</html>
